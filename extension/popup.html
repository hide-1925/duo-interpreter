<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Duo Interpreter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="mark">A⇄B</span>
    <div><strong>Duo Interpreter</strong><small><span id="extVersion">Chrome / Edge</span> · HTML本体</small></div>
  </header>
  <section>
    <span class="label">現在のタブ</span>
    <div id="currentTab" class="tab">取得中…</div>
  </section>
  <section>
    <span class="label">字幕対象</span>
    <div id="targetTab" class="tab muted">未設定</div>
  </section>
  <div class="grid target-actions"><button id="setTarget" class="primary" disabled>このタブに字幕表示</button><button id="conferenceMic" aria-pressed="false">Web会議マイク音声</button></div>
  <p id="overlayState" role="status"></p>
  <div class="grid">
    <button id="openCaptionWindow">ウィンドウ外に字幕</button>
    <button id="openText">テキスト入力</button>
    <button id="toggleOverlay">タブ内字幕を隠す</button>
    <button id="clearEntries">字幕を消去</button>
    <button id="openApp">HTML本体を開く</button>
    <button id="openOverlaySettings">オーバーレイ表示設定</button>
    <button id="resetOverlay">位置をリセット</button>
    <button id="downloadInteraction">字幕操作ログを保存</button>
  </div>
  <div id="textComposer"></div><p id="conferenceStatus" role="status"></p>
  <!-- 接続先の設定は使う頻度が低く、字幕の操作より下に置く。判断層の許可はここが唯一の入口。 -->
  <section>
    <label class="label" for="htmlSource">HTML本体のURL</label>
    <div class="grid source-row">
      <input id="htmlSource" type="url" autocomplete="off" spellcheck="false" aria-describedby="htmlConnection" placeholder="https://…">
      <button id="registerHtml">HTML本体に登録</button>
    </div>
    <div id="htmlConnection" role="status"></div>
  </section>
  <section>
    <label class="label" for="turnOrigin">判断層（Jev）の接続先</label>
    <div class="grid source-row">
      <input id="turnOrigin" type="url" autocomplete="off" spellcheck="false" aria-describedby="turnConnection" placeholder="https://api.typesafe.ai">
      <button id="allowTurn">この接続先を許可</button>
    </div>
    <div id="turnConnection" role="status"></div>
  </section>
  <p id="status" role="status"></p>
  <footer>初回から「HTML本体を開く」で起動できます。URLを変更したときは「HTML本体に登録」を押してください。音声の共有・認識・翻訳はHTML本体で行います。</footer>
  <script src="html-caption-command.js"></script>
  <script src="text-composer.js"></script><script src="popup.js"></script>
</body>
</html>
